<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منزل تيك توك - بدون موسيقى</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #0f172a;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        h2 { margin-bottom: 20px; color: #38bdf8; }
        input {
            width: 100%;
            padding: 14px;
            border: 2px solid #334155;
            border-radius: 8px;
            background: #0f172a;
            color: #fff;
            font-size: 16px;
            box-sizing: border-box;
            margin-bottom: 15px;
        }
        button {
            width: 100%;
            padding: 14px;
            background: #0284c7;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover { background: #0369a1; }
        .loading {
            display: none;
            margin-top: 15px;
            color: #f59e0b;
            font-size: 14px;
        }
        .result {
            display: none;
            margin-top: 20px;
        }
        .result img {
            width: 100%;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .btn-download {
            display: block;
            background: #10b981;
            color: white;
            text-decoration: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>تنزيل بدون موسيقى 🎬</h2>
    <input type="url" id="tiktokUrl" placeholder="الصح رابط مقطع التيك توك هنا..." required>
    <button onclick="processVideo()">تحميل وتنقية الصوت</button>

    <div class="loading" id="loadingText">
        ⏳ جاري عزل الموسيقى بالذكاء الاصطناعي... (قد يستغرق 20 ثانية)
    </div>

    <div class="result" id="resultContainer">
        <img id="videoCover" src="" alt="غلاف الفيديو">
        <p id="videoTitle"></p>
        <a id="downloadVideoBtn" class="btn-download" href="#" target="_blank">تحميل الفيديو الأصلي</a>
        <a id="downloadAudioBtn" class="btn-download" style="background:#8b5cf6;" href="#" target="_blank">تحميل صوت الكلام الصافي</a>
    </div>
</div>

<script>
async function processVideo() {
    const url = document.getElementById('tiktokUrl').value;
    const loadingText = document.getElementById('loadingText');
    const resultContainer = document.getElementById('resultContainer');

    if (!url) {
        alert("يرجى وضع رابط الفيديو أولاً!");
        return;
    }

    loadingText.style.display = 'block';
    resultContainer.style.display = 'none';

    try {
        const response = await fetch('/api/download', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url: url })
        });

        const data = await response.json();

        if (data.success) {
            document.getElementById('videoCover').src = data.cover;
            document.getElementById('videoTitle').innerText = data.title;
            document.getElementById('downloadVideoBtn').href = data.videoUrl;
            document.getElementById('downloadAudioBtn').href = data.cleanAudioUrl;
            
            resultContainer.style.display = 'block';
        } else {
            alert(data.error || 'حدث خطأ في جلب المقطع');
        }
    } catch (err) {
        alert('فشل الاتصال بالسيرفر');
    } finally {
        loadingText.style.display = 'none';
    }
}
</script>

</body>
</html>
