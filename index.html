<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محمّل المقاطع النظيفة 🎬</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Tajawal', sans-serif; transition: all 0.3s ease; }
        body { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; padding: 20px; color: #f8fafc; }
        .card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); width: 100%; max-width: 460px; padding: 35px 25px; border-radius: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.4); text-align: center; }
        h1 { font-size: 26px; margin-bottom: 8px; font-weight: 700; color: #38bdf8; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 28px; }
        .input-group { margin-bottom: 20px; }
        input[type="url"] { width: 100%; padding: 16px; border-radius: 14px; border: 2px solid #334155; background: #0f172a; color: #fff; font-size: 15px; text-align: center; outline: none; }
        input[type="url"]:focus { border-color: #38bdf8; box-shadow: 0 0 12px rgba(56, 189, 248, 0.3); }
        .btn { width: 100%; background: #38bdf8; color: #0f172a; border: none; padding: 16px; font-size: 16px; font-weight: 700; border-radius: 14px; cursor: pointer; }
        .btn:hover { background: #7dd3fc; transform: translateY(-2px); box-shadow: 0 8px 20px rgba(56, 189, 248, 0.4); }
        .btn:disabled { background: #64748b; cursor: not-allowed; box-shadow: none; transform: none; }
        #status { margin-top: 15px; font-size: 14px; font-weight: bold; word-break: break-all; }
        .success { color: #4ade80; }
        .error { color: #f87171; }
    </style>
</head>
<body>

<div class="card">
    <h1>محمّل المقاطع النظيفة 🎬</h1>
    <p>حمّل من تيك توك وانستقرام بدون علامة مائية وبأعلى جودة</p>

    <form id="downloadForm">
        <div class="input-group">
            <input type="url" id="videoUrl" placeholder="ألصق رابط المقطع هنا..." required autocomplete="off">
        </div>
        <button type="submit" id="submitBtn" class="btn">تحميل المقطع الآن 🚀</button>
    </form>
    
    <div id="status"></div>
</div>

<script>
document.getElementById('downloadForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    // تنظيف الرابط من أي مسافات أو سلاش زائدة ومسحها من الشاشة عشان تشوفها بعينك
    let urlInput = document.getElementById('videoUrl').value.trim();
    while (urlInput.startsWith('/')) {
        urlInput = urlInput.substring(1);
    }
    document.getElementById('videoUrl').value = urlInput;

    const btn = document.getElementById('submitBtn');
    const status = document.getElementById('status');

    if (!urlInput) return;

    btn.disabled = true;
    btn.innerText = 'جاري التجهيز... ⏳';
    status.className = '';
    status.innerText = '';

    try {
        // محرك 1: مخصص وسريع جداً لتيك توك
        if (urlInput.includes('tiktok.com')) {
            const response = await fetch(`https://www.tikwm.com/api/?url=${encodeURIComponent(urlInput)}`);
            const data = await response.json();
            if (data.data && data.data.play) {
                status.className = 'success';
                status.innerText = 'تم التجهيز! جاري فتح التحميل... 🚀';
                window.location.href = data.data.play;
                btn.disabled = false;
                btn.innerText = 'تحميل المقطع الآن 🚀';
                return;
            }
        }

        // محرك 2: بديل قوي للانستقرام (سيرفر Cobalt مستقر)
        const response = await fetch('https://co.wuk.sh/api/json', {
            method: 'POST',
            headers: {
                'Accept': 'application/json',
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ url: urlInput })
        });

        if (!response.ok) throw new Error('فشل الاتصال');
        const data = await response.json();

        if (data.url) {
            status.className = 'success';
            status.innerText = 'تم التجهيز! جاري فتح التحميل... 🚀';
            window.location.href = data.url;
        } else {
            throw new Error('لا يوجد رابط');
        }
    } catch (err) {
        status.className = 'error';
        status.innerText = 'عذراً، سيرفرات التحميل عليها ضغط أو الرابط غير صالح. جرب مرة أخرى!';
    } finally {
        btn.disabled = false;
        btn.innerText = 'تحميل المقطع الآن 🚀';
    }
});
</script>

</body>
</html>
